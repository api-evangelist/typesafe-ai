checked: '2026-09-19'
summary: >-
  TypeSafe publishes NO API or product changelog. What it does publish is two dated, well-structured
  SDK changelogs — Breaking Changes / Features / Bug fixes / Documentation, every entry carrying a
  semver version and an ISO date. Both libraries reached their first public release in September 2026
  and both have already shipped a breaking change, which is the honest headline here: the clients are
  moving weekly and are not yet stable.
