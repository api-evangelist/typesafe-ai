- {from: SystemOneResponse, to: Answer, type: has_many, via: answers, keyed_by: the same caller-chosen string}
- {from: SystemOneResponse, to: Usage, type: has_one, via: usage}
- {from: Question, to: NoulQuestion, type: discriminates, via: 'type = "noul"'}
- {from: Question, to: ChoiceQuestion, type: discriminates, via: 'type = "choice"'}
- {from: Question, to: ScoreQuestion, type: discriminates, via: 'type = "score"'}
