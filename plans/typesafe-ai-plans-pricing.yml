buyer_note: >-
  A buyer CAN cost a workload here, which is more than most early-access AI labs allow: the input
  price is published, output is free, and the token ceilings per request are documented. What a buyer
  cannot do is find out what an account costs to open, whether there is a free allowance, how billing
  is periodised, or what an enterprise tier includes.
