  availability_published: true
  uptime_observed: 99.853%
  uptime_window: rolling 90-day per-day history shown on the page
  uptime_note: >-
    The page shows dated per-day downtime for the whole window (for example "Down for 20 minutes" on
    2026-07-09 and 18 minutes on 2026-07-10), which is a more candid operational record than a
    green/red badge. Read 2026-09-19 at 12:20 UTC; "All services are online".
  machine_readable_api: false
  machine_readable_note: >-
