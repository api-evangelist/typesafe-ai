- {from: Answer, to: NoulAnswer, type: discriminates, via: 'type = "noul"'}
- {from: Answer, to: ChoiceAnswer, type: discriminates, via: 'type = "choice"'}
- {from: Answer, to: ScoreAnswer, type: discriminates, via: 'type = "score"'}
- {from: ModelMetadataList, to: ModelMetadata, type: has_many, via: models}
- {from: HTTPValidationError, to: ValidationError, type: has_many, via: detail}
- {from: NoulQuestion, to: NoulAnswer, type: pairs_with, via: 'the shared question id and matching `type`'}
- {from: ChoiceQuestion, to: ChoiceAnswer, type: pairs_with, via: 'the shared question id and matching `type`'}
- {from: ScoreQuestion, to: ScoreAnswer, type: pairs_with, via: 'the shared question id and matching `type`'}
type_asymmetries:
- finding: 'criteria has three different shapes across the three question types.'
  detail: >-
    Noul criteria is an OBJECT ({true, false}) and optional; Choice criteria is a MAP of option to
    description and REQUIRED; Score criteria is an ORDERED ARRAY of at least two levels and REQUIRED.
    A client that writes one generic criteria handler will break on at least one type.
- finding: 'confidence is present on Choice and Score answers and ABSENT on Noul answers.'
  detail: >-
    A Noul returns the probability itself (`noul`, 0–1) rather than a separate confidence. Code that
    reads answer.confidence uniformly will read undefined for every Noul.
- finding: '`instructions` accepts string, object OR array on every question type.'
  detail: >-
    Documented as deliberate ("Instructions, Choice options, Score levels, and Noul criteria all
    accept JSON structure"), so a client cannot assume a string.
- finding: 'Score.criteria was a dict keyed by integers before 2026-09-15.'
  detail: >-
    Both SDKs changed it to an ordered sequence in their 0.6.0 releases on the same day. The current
    spec agrees with the new shape; nothing on the server side records the change. See changelog/.
identifiers:
  server_assigned: []
  server_assigned_note: 'None. The API returns no id of any kind — no request id, no answer id, no resource id.'
  client_assigned: [question id]
  model_identifiers:
    versioned: 'jev-1.13.0'
    aliases: [jev-latest, jev-preview]
    echoed_back: 'SystemOneResponse.model reports the versioned ID that actually answered.'
