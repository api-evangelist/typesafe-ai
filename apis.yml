aid: typesafe-ai
name: TypeSafe AI
description: >-
  TypeSafe AI is a San Francisco AI lab building System One models — a class of model trained to
  return typed, calibrated decisions for software instead of generated text. Its flagship and first
  System One model, Jev, is served by a single HTTP endpoint: POST /v1/systemone takes a `state`
  (a string, JSON object, or array) plus a map of typed questions and returns one structured answer
  per question. Three question primitives are published: Noul (a yes/no question answered with the
  probability the answer is yes), Choice (one option from a caller-defined set, returned with the
  full probability distribution) and Score (a rating against ordered rubric levels, returned as a
  probability-weighted value plus a legend). Choice and Score answers also carry a confidence value
  derived from the distribution, which is the mechanism TypeSafe intends callers to threshold on to
  decide when code may act autonomously and when it must escalate to a human. The model is trained
  with Reinforcement Learning for Calibrated Decisions (RLCD) rather than RLHF, is not fine-tuned or
  LoRA-adapted per customer, and is not trained on customer requests or responses. The company
  publishes an OpenAPI 3.1 contract on its API host, official Python and TypeScript SDKs, an
  installable Agent Skill for Claude Code and other coding agents, an A2A agent card, an anonymous
  documentation MCP server, an llms.txt index, a Better Stack status page and a Vanta trust center.
