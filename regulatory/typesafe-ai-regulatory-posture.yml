summary: >-
  For an early-access AI lab, an unusually complete horizontal posture: a full DPA with EU SCCs and
  the UK Addendum, a 72-hour incident-notification commitment, a named subprocessor-list location, a
  US data-residency statement, a published no-training-on-customer-data commitment, zero data
  retention offered to enterprise, and a per-version model-limitations page. What is absent is the
  accessibility and supply-chain half: no VPAT or accessibility conformance report, no SBOM, no
  transparency report, no support-lifetime commitment, and no Global Privacy Control statement.
