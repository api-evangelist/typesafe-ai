  source: https://docs.typesafe.ai/models
  marketing_corroboration:
    quote: '$42 Per Billion input tokens. 238x Lower input price than Claude Fable 5.1'
    url: https://typesafe.ai/
    note: >-
      The homepage repeats the same rate and frames it as a comparison against a frontier LLM. The
      comparative claim is the provider's, recorded verbatim and not verified here.
  terminology_note: >-
    TypeSafe prices per BILLION tokens (Btok) as the headline unit, which is a deliberate framing
    choice — the same rate is $0.042 per million, roughly two orders of magnitude below
    general-purpose LLM input pricing. Both units are published; the per-Mtok figure is the one that
    compares directly to every other inference vendor.
