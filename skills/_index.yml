  TypeSafe is one of the few providers in this catalog that publishes its OWN agent skill, and it
  publishes two copies through two channels: one served from its docs host at a /.well-known/
  path and named by its A2A agent card, one distributed as a Claude Code plugin marketplace from its
  GitHub org. Both are saved here verbatim. The two generated skills below are additions, not
  replacements — they bind the flows to verified operationIds and to this repo's conventions/errors
  artifacts, which the provider's skills deliberately delegate to the live docs instead.
