checked: '2026-09-19'
summary: >-
  An early-access API with a real operational surface and no lifecycle policy. There is a public
  status page with 90 days of per-day history, dated SDK changelogs, a published model-alias scheme
  with explicit pinning guidance, and a per-version known-limitations page — but no deprecation
  policy, no Sunset/Deprecation headers, no SLA, no support window, and no roadmap. The model alias
  IS the lifecycle mechanism, and TypeSafe says out loud that an alias can move under a caller.
versioning:
  scheme: path-segment-plus-model-alias
  api_path: /v1/
  api_path_note: 'Both operations are under /v1/. No second version has ever been published, so no migration precedent exists.'
  spec_version: 0.2.0
  spec_version_note: 'info.version of the served OpenAPI. Below 1.0 — an explicit pre-stable signal.'
  model_versions:
    current: jev-1.13.0
    aliases:
    - {alias: jev-latest, points_to: jev-1.13.0, meaning: 'Most recent stable, official release. The SDK default and the docs default.'}
    - {alias: jev-preview, points_to: jev-1.13.0, meaning: 'Most recent release, official or not. Moves ahead of jev-latest when a preview build exists; currently identical.'}
    pinning_supported: true
    pinning_note: >-
      A versioned ID is accepted in the `model` field whether or not GET /v1/models lists it, and the
      response reports the versioned ID that answered. So a caller can pin, and can audit after the
      fact which build produced a result.
    alias_drift_warning_verbatim: >-
      "An alias moves when a new release ships, so the answers behind it can change without a change
      on your side. ... If you have tuned confidence thresholds against a specific version, pin that
      version's ID instead of the alias and move to the new one on your own schedule."
    implication: >-
      This is the substantive lifecycle risk in this API and the provider documents it honestly. A
      caller whose business logic thresholds on `confidence` is coupled to a model build, and the
      default (`jev-latest`) is the moving one. There is no published notice period for an alias move.
  source: https://docs.typesafe.ai/models
model_transparency:
  jaggedness_page:
    url: https://docs.typesafe.ai/model-jaggedness/jev-1.13
    status: 200
    purpose: >-
      Per-version list of known weak spots — "Jev isn't perfect. Here are some jagged edges we are
      aware of with jev-1.13. Many of these will be fixed in later versions."
    note: >-
      A published, version-scoped limitations document is rare and is the closest thing TypeSafe has
      to release notes for the model itself. Recorded under lifecycle because it is versioned and it
      is where a caller learns what changed in practice.
  self_consistency_cookbooks:
  - https://docs.typesafe.ai/cookbooks/consistency_noul_cookbook
  - https://docs.typesafe.ai/cookbooks/consistency_choice_cookbook
