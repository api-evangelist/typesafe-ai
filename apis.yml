apis:
- aid: typesafe-ai:system-one-api
  name: TypeSafe System One API
  description: >-
    The TypeSafe System One HTTP API. POST /v1/systemone evaluates a `state` against a map of typed
    Noul / Choice / Score questions and returns one calibrated answer per question with
    probabilities, confidence and token usage; GET /v1/models lists the model names and aliases the
    calling account may send. Authentication is a bearer API key in the Authorization header.
    OpenAPI 3.1.0 is served anonymously at https://api.typesafe.ai/openapi.json with a ReDoc
    renderer at /redoc.
