method: probed
source: live probes of the named /.well-known/ path list on every TypeSafe host
checked: '2026-09-19'
summary: >-
  Two real documents are served across five hosts. console.typesafe.ai serves an RFC 9116
  security.txt, and docs.typesafe.ai serves an A2A Agent Card at the canonical
  /.well-known/agent-card.json path. Both the WellKnown and the SecurityTxt pointer are
  therefore earned. Nothing else is served anywhere: no OIDC discovery, no RFC 8414 / RFC 9728
  OAuth metadata, no api-catalog, no ai-plugin.json, no AAuth resource document, no UCP/ACP,
  and no apis.json index on any host or at either domain-root path.
pointer_basis: >-
  WellKnown emitted on the strength of the security.txt (console.typesafe.ai) and the agent card
  (docs.typesafe.ai). SecurityTxt emitted on the strength of the console.typesafe.ai security.txt.
  The agent card is registered separately as AgentCard via a2a/typesafe-ai-a2a.yml.
false_positive_watch: >-
  console.typesafe.ai answers HTTP 200 with the 43,618-byte Next.js console SPA shell for EVERY
  path, including a negative-control path that cannot exist. Every 200 on that host below is
  recorded as a MISS except the security.txt, which is distinguishable on three independent
  grounds: content-type text/plain rather than text/html, a 223-byte body rather than the 43,618-byte
  shell, and a body that parses as RFC 9116 field lines. A future round that promotes any other
  console.typesafe.ai /.well-known/ 200 into a served document is wrong.
