interpretation: >-
  This is a DOCUMENTATION agent card, not an operational one. Its url, provider.url,
  documentationUrl and its only interface entry all point at https://docs.typesafe.ai/ — the docs
  site — and the skill it advertises is a reference document, not a callable task. The card's
  practical value is that it hands an agent the entry point to TypeSafe's published skill and, via
  the same host, an anonymous MCP server at https://docs.typesafe.ai/mcp (see mcp/). It does NOT
  advertise the System One evaluation endpoint, which is the thing an agent would actually call:
  api.typesafe.ai/v1/systemone appears nowhere in the card. Recorded as observed; the gap is the
  provider's to close, not ours to fill in.
