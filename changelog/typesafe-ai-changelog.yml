observations:
  coordinated_breaking_change: >-
    The `Score.criteria` change landed in BOTH SDKs at 0.6.0 on the same day (2026-09-15), which
    means the server-side contract for Score criteria changed from a dictionary keyed by integers to
    an ordered sequence — and that server change is documented NOWHERE. The served OpenAPI now types
    ScoreQuestion.criteria as an array with an example of ["Calm","Frustrated","Very angry"], so the
    spec agrees with the new shape; nothing records that it used to be different. This is exactly
    what an API changelog would carry and the SDK changelogs are carrying by proxy.
  release_cadence: 'Four releases across two libraries in eight days.'
  breaking_ratio: '3 of 5 entries are breaking, both libraries below 1.0.'
