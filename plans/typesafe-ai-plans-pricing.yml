summary: >-
  TypeSafe publishes NO plans and NO pricing page — typesafe.ai/pricing and docs.typesafe.ai/pricing
  both 404, and the site has no pricing route in its sitemap. What it does publish is a single,
  specific usage price attached to the model rather than to a tier: $42 per billion input tokens
  ($0.042 per million), output tokens free. That is unusually concrete for a company in early access,
  and it is stated twice — on the Models page and on the marketing homepage. Everything beyond that
  one rate is a sales conversation: higher rate limits and zero data retention are both described as
  available on "custom and enterprise plans" with no structure, no names, and no prices.
plan_count: 0
plan_count_basis: >-
  Zero NAMED, purchasable tiers are published anywhere. This is not an absent pricing page with tiers
  behind it — there is no pricing page at all, and no tier names appear in the docs, the sitemap, or
  the marketing site. Recorded as 0 rather than omitted, per the pipeline rule that an honest zero is
  data.
plans: []
