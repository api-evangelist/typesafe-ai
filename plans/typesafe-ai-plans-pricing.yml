  published: true
  model: jev-1.13.0
  unit: input token
  price_per_billion_input_tokens: 42.00
  price_per_million_input_tokens: 0.042
  currency: USD
  output_tokens: free
  output_tokens_quote: 'Charged per input token. Output tokens are free.'
  billing_period: not-published
