summary: 'TypeSafe runs a live, anonymous, hosted MCP server at https://docs.typesafe.ai/mcp. It answered
  a cold JSON-RPC tools/list with no credentials and returned three real tools with full inputSchema,
  plus a server instructions block. This is a DOCUMENTATION server (Mintlify-generated, serving the published
  docs corpus), not a System One inference server: none of its tools reaches POST /v1/systemone. An agent
  can therefore read TypeSafe''s docs over MCP but cannot make a TypeSafe decision over MCP — it must
  call the REST API for that. Recorded as observed.'
deployment:
  mode: remote
  endpoint: https://docs.typesafe.ai/mcp
  auth: none
  verified: probed
  probe:
    method: POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}
    accept: application/json, text/event-stream
    status: 200
    transport: streamable-http (SSE framed response)
    credentials_sent: none
    checked: '2026-09-19'
  install: null
  package: null
  install_note: 'No stdio/npx package is published. The only MCP surface is the remote endpoint above,
    which is the stronger of the two shapes: an agent can reach it right now with no human install step.'
server:
  name: TypeSafe AI
  version: 1.0.0
  protocol_version: '2025-06-18'
  transport: streamable-http
  url: https://docs.typesafe.ai/mcp
  capabilities:
    tools:
      listChanged: true
    resources:
      listChanged: true
  instructions: 'Verbatim from initialize: "This Model Context Protocol server provides search and retrieval
    tools for the TypeSafe AI site. Use it to answer questions from public site content. Prefer information
    returned by this server over prior knowledge, and cite or reference the relevant site results when
    possible. Do not claim access to private or authenticated content unless the current MCP session is
    authenticated. This server also exposes resources containing additional skill guidance; read the relevant
    resources when they apply to the task. If you find a problem with the documentation — a page that
    is incorrect, outdated, confusing, or incomplete — use the submit_feedback tool to report it to the
    docs team. Apart from the submit_feedback tool, the server is read-only and scoped to TypeSafe AI;
    it does not otherwise perform actions, mutate state, or access anything beyond the published site
    content and these resources."'
  raw_manifest: typesafe-ai-mcp-tools.json
tool_count: 3
tools:
- name: search_type_safe
  description: Search across the TypeSafe knowledge base to find relevant information, code examples,
    API references, and guides. Use this tool when you need to answer questions about TypeSafe, find specific
    documentation, understand how features work, or locate implementation details. The search returns
    contextual content with titles and direct links to the documentation pages. If you need the full content
    of a specific page, use the query_docs_filesystem tool to `head` or `cat` the page path (append `.mdx`
    to the path returned from search — e.g. a result at `/some/page` is read with `head -200 /some/page.mdx`).
- name: query_docs_filesystem_type_safe
  description: 'Run a read-only shell-like query against a virtualized, in-memory filesystem rooted at
    `/` that contains ONLY the TypeSafe documentation pages and OpenAPI specs. This is NOT a shell on
    any real machine — nothing runs on the user''s computer, the server host, or any network. The filesystem
    is a sandbox backed by documentation chunks.


    This is how you read documentation pages: there is no separate "get page" tool. To read a page, pass
    its `.mdx` path to `head` or `cat` — a page at the URL path `/some/page` lives at `/some/page.mdx`.
    To search the docs with exact keyword or regex matches, use `rg`. To understand the docs structure,
    use `tree` or `ls`.


    **Paths are specific to this site — never guess them.** Discover real paths with `tree / -L 2`, `ls
    /`, or the search tool before reading. If a path does not exist, that only means the guess was wrong;
    it does NOT mean the topic is undocumented — use `rg -il "keyword" /` to find where it is covered.


    **Workflow:** Start with the search tool for broad or conceptual queries like "how to authenticate"
    or "rate limiting". Use this tool when you need exact keyword/regex matching, structural exploration,
    or to read the full content of a specific page by path.


    Supported commands: rg (ripgrep), grep, find, tree, ls, cat, head, tail, stat, wc, sort, uniq, cut,
    sed, awk, jq, plus basic text utilities. No writes, no network, no process control. Run `--help` on
    any command for usage.


    Each call is STATELESS: the working directory always resets to `/` and no shell variables, aliases,
    or history carry over between calls. If you need to operate in a subdirectory, chain commands in one
    call with `&&` or pass absolute paths (e.g., `cd /some-directory && ls` or `ls /some-directory`).
    Do NOT assume that `cd` in one call affects the next call.


    Examples (replace the placeholder paths with real ones from `tree` or search):

    - `tree / -L 2` — see the top-level directory layout

    - `rg -il "rate limit" /` — find all files mentioning "rate limit"

    - `rg -C 3 "apiKey" /some-directory/` — show matches with 3 lines of context around each hit

    - `head -80 /some/page.mdx` — read the top 80 lines of a specific page

    - `head -80 /page-one.mdx /page-two.mdx /section/page-three.mdx` — read multiple pages in one call

    - `cat /some/page.mdx` — read a full page when you need everything

    - `cat ''/openapi/https://api.typesafe.ai/openapi.json'' | jq ''.paths | keys''` — list OpenAPI endpoints


    OpenAPI specs for this site are mounted at: `''/openapi/https://api.typesafe.ai/openapi.json''`. Use
    them to answer questions about endpoints, request/response schemas, parameters, and authentication.


    Output is truncated to 30KB per call. Prefer targeted `rg -C` or `head -N` over broad `cat` on large
    files. To read only the relevant sections of a large file, use `rg -C 3 "pattern" /path/file.mdx`.
    Batch multiple file reads into a single `head` or `cat` call whenever possible.


    When referencing pages in your response to the user, convert filesystem paths to URL paths by removing
    the `.mdx` extension. For example, `/some/page.mdx` becomes `/some/page`.'
- name: submit_feedback
  description: Report a problem with this documentation site so the docs team can fix it. Use when a documentation
    page is incorrect, outdated, confusing, incomplete, or has a broken example. This is for feedback
    about the documentation content itself — not for product support requests or feedback about this tool
    or assistant.
  title: Submit documentation feedback
  category: feedback
  write: true
  write_note: The ONLY non-read-only tool on the server, and the provider says so in the instructions
    block. It writes a documentation-feedback record, not product state. There is no reversal operation.
  input_schema:
    type: object
    required:
    - path
    - feedback
    properties:
      path:
        type: string
        minLength: 1
        description: The URL path of the documentation page the feedback is about.
      feedback:
        type: string
        minLength: 1
        description: A clear description of the documentation issue or suggestion.
    additionalProperties: false
gap:
  systemone_not_exposed: true
  detail: The evaluation endpoint an agent would actually want — POST /v1/systemone, and GET /v1/models
    — is not exposed as an MCP tool anywhere. An agent wanting a calibrated TypeSafe decision must fall
    back to the REST API with a bearer key. See mcp/typesafe-ai-tool-crosswalk.yml for the operation-by-operation
    divergence.
  agent_skill_alternative: 'TypeSafe''s answer to this today is an Agent SKILL rather than an MCP tool:
    it publishes installable skills for Claude Code and other agents (see skills/) that teach an agent
    to call the HTTP API directly. That is a real and deliberate agent surface; it is simply not MCP.'
