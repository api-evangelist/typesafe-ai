summary: >-
  TypeSafe publishes hard numbers — 250,000 tokens per second and 1,200 requests per minute — on its
  Models page, attached to the model rather than to a plan. It also publishes, in the same breath,
  that those numbers can change without notice while it scales. That warning is the most important
  field in this file: an integrator can read the limit but cannot rely on it, and no response header
  is documented that would let a client discover the current value at runtime.
