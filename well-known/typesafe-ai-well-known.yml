security_txt:
  file: typesafe-ai-security.txt
  host: console.typesafe.ai
  rfc: RFC 9116
  fields:
    Contact: mailto:security@typesafe.ai
    Encryption: https://console.typesafe.ai/.well-known/pgp-key.asc
    Expires: '2027-02-26T00:00:00.000Z'
    Canonical: https://console.typesafe.ai/.well-known/security.txt
    Preferred-Languages: en
  expires_valid: true
  policy_field_present: false
  policy_note: >-
    No Policy: field, so the document names a contact but no published disclosure process. See
    security/typesafe-ai-vulnerability-disclosure.yml.
  canonical_mismatch_note: >-
    The Canonical field names console.typesafe.ai, which is where the document is actually served.
    It is NOT served on the registrable domain typesafe.ai, so a researcher following RFC 9116's
    own guidance (look at the organisation's primary domain first) will 404 before finding it.
    Serving the same file at https://typesafe.ai/.well-known/security.txt is a one-file fix.
