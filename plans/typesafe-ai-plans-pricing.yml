  offers:
  - Higher rate limits than the published 250,000 tokens/sec and 1,200 req/min
  - Zero data retention (ZDR) — contact privacy@typesafe.ai
  published_values: false
  source: https://docs.typesafe.ai/models
access_gate:
  self_serve_signup: gated
  detail: >-
    Jev is described as early access and the marketing site's primary call to action is "Join
    Waitlist". console.typesafe.ai redirects every path to /login, including /signup, so whether an
    account can be created without an invitation could not be established from outside. A key is
    created at https://console.typesafe.ai/keys once an account exists.
  evidence:
  - {url: 'https://console.typesafe.ai/signup', status: 200, observed: 'redirects to /login?returnTo=%2Fsignup'}
  - {url: 'https://console.typesafe.ai/login', status: 200, observed: 'Passwordless page — "Welcome to TypeSafe", Continue with Google or an emailed code. It is both the sign-in and the sign-up affordance; there is no separate registration form and no password. Whether a new Google account is accepted without a waitlist invitation was NOT tested.'}
  - {url: 'https://typesafe.ai/', status: 200, observed: '"Join Waitlist" call to action; "Try our first System One Model, Jev, in early access."'}
