by_schema:
- schema: SystemOneRequest
  examples:
    state: ['I was charged twice. Please help.', {subject: Duplicate charge, message: Please help.}]
    model: [jev-latest]
    questions: [{billing: {type: noul, instructions: 'Is this message about billing?'}}]
  note: 'Two `state` examples deliberately show both accepted shapes — a plain string and a structured object.'
- schema: SystemOneResponse
  examples:
    model: [jev-latest]
    answers: [{billing: {type: noul, noul: 0.98}}]
    usage: [{input_tokens: 120, output_tokens: 12}]
- schema: NoulQuestion
  examples:
    type: [noul]
    instructions: ['Is this message spam?', 'This message contains unsolicited advertising.', {task: Identify unsolicited advertising.}]
    criteria: [{'true': Unsolicited advertising, 'false': A legitimate conversation}]
  note: >-
    Three `instructions` examples covering all three accepted forms — an interrogative string, a
    declarative statement, and a JSON object. This is the clearest published demonstration that a
    Noul accepts a statement to evaluate as well as a question to answer.
- schema: NoulAnswer
  examples: {type: [noul], noul: [0.98]}
- schema: NoulCriteria
  examples:
    'true': ['The message is unsolicited advertising.']
    'false': ['The message is a legitimate conversation.']
- schema: ChoiceQuestion
  examples:
    type: [choice]
    instructions: ['What is the tone of this message?']
    criteria: [{angry: An upset or hostile message, calm: A neutral or polite message, excited: An enthusiastic or eager message}]
- schema: ChoiceAnswer
  examples:
    type: [choice]
    choice: [angry]
    confidence: [0.9]
    probabilities: [{angry: 0.8, calm: 0.1, excited: 0.1}]
  note: 'The probabilities example sums to 1.0, matching the documented contract.'
- schema: ScoreQuestion
  examples:
    type: [score]
    instructions: ['How urgent is this message?']
    criteria: [['Can wait', 'Needs attention this week', 'Needs attention today']]
  note: 'The array-of-levels example reflects the post-2026-09-15 shape (ordered sequence, not an integer-keyed dict).'
- schema: ScoreAnswer
  examples:
    type: [score]
    score: [1.7]
    confidence: [0.9]
    legend: [{'0': Can wait, '1': Needs attention this week, '2': Needs attention today}]
    probabilities: [{'0': 0.1, '1': 0.1, '2': 0.8}]
  note: >-
    score 1.7 against levels 0/1/2 demonstrates the documented behaviour that a Score can land
    BETWEEN levels — the single most easily misread field in this API.
- schema: Usage
  examples: {input_tokens: [120], output_tokens: [12]}
- schema: ModelMetadata
  examples:
    name: [jev-latest]
    description: ['General-purpose system one model.']
    release_date: ['2026-09-15']
- schema: ModelMetadataList
  examples:
    models: [[{name: jev-latest, description: 'General-purpose system one model.', release_date: '2026-09-15'}]]
- schema: HTTPValidationError
  examples:
    detail: [[{loc: [body, state], msg: Field required, type: missing}]]
- schema: ValidationError
  examples:
    loc: [[body, questions, urgency, score, criteria]]
    msg: [Field required]
    type: [missing]
    input: [{type: score}]
    ctx: [{min_length: 1}]
  note: >-
    The most useful error example in the set: it shows a Score question rejected for having fewer
